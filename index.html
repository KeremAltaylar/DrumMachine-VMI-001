<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141b18" />
  <title>VMI-001 — Drum Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500&display=swap" />
  <link rel="stylesheet" type="text/css" href="style.css" />
  <script src="libraries/p5.js"></script>
  <script src="libraries/p5.sound.js"></script>
</head>

<body>
  <div class="app" id="app">
    <header class="bar">
      <div class="brand">
        <span class="mark">VMI-001</span>
        <h1>Drum<span class="long"> Machine</span></h1>
      </div>
      <div class="bar-actions">
        <span class="clip" id="clip" aria-live="polite" hidden>Clip</span>
        <button type="button" id="power" class="btn btn-primary">Start audio</button>
        <button type="button" id="transport" class="btn" aria-pressed="false">Play</button>
      </div>
    </header>

    <div class="scope" id="scope"></div>

    <section class="sequencer" id="sequencer" aria-label="Step sequencer"></section>

    <main class="panels">
      <section class="panel">
        <h2>Transport</h2>
        <div class="field">
          <label for="bpm">Tempo</label><span class="value" id="bpm-out"></span>
          <input type="range" id="bpm" min="40" max="220" step="1" value="90" />
        </div>
        <div class="field">
          <label for="swing">Swing</label><span class="value" id="swing-out"></span>
          <input type="range" id="swing" min="0" max="0.7" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="humanize">Humanise</label><span class="value" id="humanize-out"></span>
          <input type="range" id="humanize" min="0" max="0.4" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="steps">Steps</label><span class="value" id="steps-out"></span>
          <input type="range" id="steps" min="4" max="16" step="1" value="16" />
        </div>
      </section>

      <section class="panel">
        <h2>Pattern</h2>
        <div class="field">
          <label for="density">Density</label><span class="value" id="density-out"></span>
          <input type="range" id="density" min="0.1" max="1" step="0.05" value="0.5" />
        </div>
        <div class="field">
          <button type="button" id="random-pattern" class="btn btn-wide">Random</button>
        </div>
        <div class="field">
          <button type="button" id="clear-pattern" class="btn btn-wide">Clear</button>
        </div>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <div class="field">
          <label>Type</label>
          <div class="segmented" id="filter-seg" role="group" aria-label="Filter type"></div>
        </div>
        <div class="field">
          <label for="filter-mix">Filter mix</label><span class="value" id="filter-mix-out"></span>
          <input type="range" id="filter-mix" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="cutoff">Cutoff</label><span class="value" id="cutoff-out"></span>
          <input type="range" id="cutoff" min="80" max="16000" step="10" value="16000" />
        </div>
        <div class="field">
          <label for="res">Resonance</label><span class="value" id="res-out"></span>
          <input type="range" id="res" min="0" max="20" step="0.1" value="1" />
        </div>
        <div class="field">
          <label for="lfo-depth">Sweep</label><span class="value" id="lfo-depth-out"></span>
          <input type="range" id="lfo-depth" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="lfo-div">Sweep rate</label><span class="value" id="lfo-div-out"></span>
          <input type="range" id="lfo-div" min="0" max="6" step="1" value="2" />
        </div>
      </section>

      <section class="panel">
        <h2>Drive</h2>
        <div class="field">
          <label for="drive">Drive mix</label><span class="value" id="drive-out"></span>
          <input type="range" id="drive" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="drive-amt">Amount</label><span class="value" id="drive-amt-out"></span>
          <input type="range" id="drive-amt" min="0" max="1" step="0.01" value="0.3" />
        </div>
      </section>

      <section class="panel wide">
        <h2>Space</h2>
        <div class="field">
          <label for="delay-mix">Delay mix</label><span class="value" id="delay-mix-out"></span>
          <input type="range" id="delay-mix" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="delay-div">Delay time</label><span class="value" id="delay-div-out"></span>
          <input type="range" id="delay-div" min="0" max="6" step="1" value="3" />
        </div>
        <div class="field">
          <label for="delay-fb">Delay feedback</label><span class="value" id="delay-fb-out"></span>
          <input type="range" id="delay-fb" min="0" max="0.9" step="0.01" value="0.4" />
        </div>
        <div class="field">
          <label for="reverb">Reverb mix</label><span class="value" id="reverb-out"></span>
          <input type="range" id="reverb" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="reverb-time">Reverb time</label><span class="value" id="reverb-time-out"></span>
          <input type="range" id="reverb-time" min="0.5" max="10" step="0.1" value="3" />
        </div>
      </section>

      <section class="panel">
        <h2>Saturate</h2>
        <div class="field">
          <label for="sat-low">Low</label><span class="value" id="sat-low-out"></span>
          <input type="range" id="sat-low" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="sat-high">High</label><span class="value" id="sat-high-out"></span>
          <input type="range" id="sat-high" min="0" max="1" step="0.01" value="0" />
        </div>
        <div class="field">
          <label for="sat-low-x">Low split</label><span class="value" id="sat-low-x-out"></span>
          <input type="range" id="sat-low-x" min="60" max="400" step="5" value="180" />
        </div>
        <div class="field">
          <label for="sat-high-x">High split</label><span class="value" id="sat-high-x-out"></span>
          <input type="range" id="sat-high-x" min="1000" max="8000" step="100" value="3200" />
        </div>
      </section>

      <section class="panel wide">
        <h2>Mix</h2>
        <div class="mix-grid" id="mix-grid"></div>
      </section>

      <section class="panel">
        <h2>Master</h2>
        <div class="field">
          <label for="volume">Volume</label><span class="value" id="volume-out"></span>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
        </div>
      </section>
    </main>
  </div>

  <script src="knob.js"></script>
  <script src="voices.js"></script>
  <script src="saturator.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
